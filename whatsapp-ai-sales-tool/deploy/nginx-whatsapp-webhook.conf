# Sample nginx front door for the WhatsApp AI sales tool.
# Proxy ALL traffic to Node. Do not set `root`/`alias` to the app directory:
# that is what publicly leaked config.local.json, server.js, and inbox data.
#
# Live callback URL: https://wa.chinagardentec.com/webhook

upstream whatsapp_ai_sales {
    server 127.0.0.1:8789;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name wa.chinagardentec.com;

    # ssl_certificate     /etc/nginx/ssl/wa.chinagardentec.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/wa.chinagardentec.com.key;

    # Defense in depth: never serve secrets even if root/try_files is added later.
    location = /config.local.json { deny all; return 403; }
    location = /config.json { deny all; return 403; }
    location ~* ^/config\.[^/]+\.json$ { deny all; return 403; }
    location ^~ /data/ { deny all; return 403; }
    location = /data { deny all; return 403; }
    location = /server.js { deny all; return 403; }
    location = /package.json { deny all; return 403; }
    location = /package-lock.json { deny all; return 403; }
    location ^~ /node_modules/ { deny all; return 403; }
    location ~ /\.env { deny all; return 403; }
    location ~* \.(zip|tar|gz|tgz|7z)$ { deny all; return 403; }
    location ^~ /deploy/ { deny all; return 403; }

    location /webhook {
        proxy_pass http://whatsapp_ai_sales;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    location /api/ {
        proxy_pass http://whatsapp_ai_sales;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://whatsapp_ai_sales;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wa.chinagardentec.com;
    return 301 https://$host$request_uri;
}
